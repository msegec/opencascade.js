    #include <utility>
    #include <vector>
    using namespace emscripten;

    #ifndef OCJS_COMMIT
    #define OCJS_COMMIT unknown
    #endif
    #define OCJS_STRING(x) #x
    #define OCJS_VALUE(x) OCJS_STRING(x)

    template <typename T>
    static val copied(const char* type, const std::vector<T>& xs) {
      return val::global(type).new_(typed_memory_view(xs.size(), xs.data()));
    }

    static val arrays(const Handle(Poly_Triangulation)& tri, const gp_Trsf& trsf, bool reversed) {
      std::vector<double> positions;
      std::vector<uint32_t> indices;
      if (!tri.IsNull()) {
        positions.reserve(3 * tri->NbNodes());
        for (int i = 1; i <= tri->NbNodes(); i++) {
          const gp_Pnt p = tri->Node(i).Transformed(trsf);
          positions.insert(positions.end(), {p.X(), p.Y(), p.Z()});
        }
        indices.reserve(3 * tri->NbTriangles());
        for (int i = 1; i <= tri->NbTriangles(); i++) {
          const Poly_Triangle& t = tri->Triangle(i);
          const uint32_t a = t.Value(1) - 1, b = t.Value(2) - 1, c = t.Value(3) - 1;
          indices.insert(indices.end(), {a, reversed ? c : b, reversed ? b : c});
        }
      }
      val out = val::object();
      out.set("positions", copied("Float64Array", positions));
      out.set("indices", copied("Uint32Array", indices));
      return out;
    }

    static val meshFace(const TopoDS_Face& face) {
      TopLoc_Location loc;
      const Handle(Poly_Triangulation)& tri = BRep_Tool::Triangulation(face, loc);
      if (tri.IsNull()) return val::null();
      const gp_Trsf& trsf = loc.Transformation();
      const bool reversed = face.Orientation() == TopAbs_REVERSED;
      const double sgn = reversed ? -1 : 1;
      tri->ComputeNormals();
      std::vector<double> normals;
      normals.reserve(3 * tri->NbNodes());
      for (int i = 1; i <= tri->NbNodes(); i++) {
        const gp_Dir d = tri->Normal(i).Transformed(trsf);
        normals.insert(normals.end(), {sgn * d.X(), sgn * d.Y(), sgn * d.Z()});
      }
      val out = arrays(tri, trsf, reversed);
      out.set("normals", copied("Float64Array", normals));
      return out;
    }

    static val meshTriangulation(const Handle(Poly_Triangulation)& tri) {
      return arrays(tri, gp_Trsf(), false);
    }

    static val sampleEdge(const TopoDS_Edge& edge) {
      std::vector<double> out;
      try {
        BRepAdaptor_Curve curve(edge);
        const double first = curve.FirstParameter(), last = curve.LastParameter();
        const GeomAbs_CurveType type = curve.GetType();
        double samples = 32;
        if (type == GeomAbs_Line) samples = 1;
        else if (type == GeomAbs_Circle)
          samples = std::max(8.0, std::ceil((std::abs(last - first) / (M_PI * 2)) * 64));
        for (int i = 0; i <= samples; i++) {
          const gp_Pnt p = curve.Value(first + ((last - first) * i) / samples);
          out.insert(out.end(), {p.X(), p.Y(), p.Z()});
        }
      } catch (...) {
        out.clear();
      }
      return copied("Float64Array", out);
    }

    EMSCRIPTEN_BINDINGS(RockettMesh) {
      function("meshFace", &meshFace);
      function("meshTriangulation", &meshTriangulation);
      function("sampleEdge", &sampleEdge);
    }

    static val versionId() {
      val out = val::object();
      out.set("occt", std::string(OCC_VERSION_COMPLETE));
      out.set("commit", std::string(OCJS_VALUE(OCJS_COMMIT)));
      return out;
    }

    static std::string extendedToUtf8(const TCollection_ExtendedString& text) {
      return TCollection_AsciiString(text).ToCString();
    }

    static val labelName(const TDF_Label& label) {
      Handle(TDataStd_Name) name;
      if (!label.FindAttribute(TDataStd_Name::GetID(), name)) return val::null();
      return val(extendedToUtf8(name->Get()));
    }

    static void setLabelName(const TDF_Label& label, const std::string& name) {
      TDataStd_Name::Set(label, TCollection_ExtendedString(name.c_str(), true));
    }

    struct BytesBuf : std::streambuf {
      explicit BytesBuf(const std::string& bytes) {
        char* data = const_cast<char*>(bytes.data());
        setg(data, data, data + bytes.size());
      }
    };

    template <typename Reader>
    static IFSelect_ReturnStatus readStepBytes(Reader& reader, const std::string& bytes) {
      BytesBuf buf(bytes);
      std::istream in(&buf);
      return reader.ReadStream("memory.step", in);
    }

    static Handle(Geom_Curve) upcastCurve(const Handle(Geom_TrimmedCurve)& curve) {
      return curve;
    }

    class CancelIndicator : public Message_ProgressIndicator {
    public:
      explicit CancelIndicator(val isCancelled) : isCancelled(std::move(isCancelled)) {}
      bool UserBreak() override { return isCancelled().as<bool>(); }
      void Show(const Message_ProgressScope&, const bool) override {}

    private:
      val isCancelled;
    };

    struct TopoDSCasts {};

    template <typename T, const T& (*to)(const TopoDS_Shape&)>
    static T cast(const TopoDS_Shape& shape) {
      return to(shape);
    }

    static int shapeHash(const TopoDS_Shape& shape, int upper) {
      if (upper < 1) throw Standard_RangeError("shapeHash: upper must be positive");
      return static_cast<int>(std::hash<TopoDS_Shape>{}(shape) % static_cast<size_t>(upper));
    }

    EMSCRIPTEN_BINDINGS(RockettHelpers) {
      function("versionId", &versionId);
      function("extendedToUtf8", &extendedToUtf8);
      function("labelName", &labelName);
      function("setLabelName", &setLabelName);
      function("readStepBytes", &readStepBytes<STEPControl_Reader>);
      function("readStepCafBytes", &readStepBytes<STEPCAFControl_Reader>);
      function("upcastCurve", &upcastCurve);
      function("shapeHash", &shapeHash);
      class_<CancelIndicator>("CancelIndicator")
        .constructor<val>()
        .function("Start", optional_override([](CancelIndicator& self) { return self.Start(); }));
      class_<TopoDSCasts>("TopoDS")
        .class_function("Vertex_1", &cast<TopoDS_Vertex, TopoDS::Vertex>)
        .class_function("Edge_1", &cast<TopoDS_Edge, TopoDS::Edge>)
        .class_function("Wire_1", &cast<TopoDS_Wire, TopoDS::Wire>)
        .class_function("Face_1", &cast<TopoDS_Face, TopoDS::Face>)
        .class_function("Shell_1", &cast<TopoDS_Shell, TopoDS::Shell>)
        .class_function("Solid_1", &cast<TopoDS_Solid, TopoDS::Solid>);
    }

additionalCppCode: |
  class OCJS {
  public:
    static Standard_Failure* getStandard_FailureData(intptr_t exceptionPtr) {
      return reinterpret_cast<Standard_Failure*>(exceptionPtr);
    }
  };
