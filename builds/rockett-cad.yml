# chains and the argument and return types of the methods it calls.
# Regenerate with src/usedSymbols.py opencascade.full.d.ts server/src, then
# again adding server/test; the difference is the test-only group.
# The helpers group holds types the additionalBindCode helpers take or
# return; keep it by hand. The TopoDS cast shim is hand-written there too,
# so TopoDS is not a generated symbol.
# The planned group holds symbols open work-order rows need before their code
# exists; keep it by hand until src/usedSymbols.py finds them in server/src.
